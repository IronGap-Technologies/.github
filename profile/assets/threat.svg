<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Attack surface comparison: cloud AI stack versus Vault-OS">
<defs>
  <pattern id="gh2" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#FFC93C" stroke-opacity="0.04" stroke-width="1"/></pattern>
  <clipPath id="ch2"><rect width="1000" height="380" rx="14"/></clipPath>
  <filter id="glh" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#ch2)">
<rect width="1000" height="380" fill="#07070A"/><rect width="1000" height="380" fill="url(#gh2)"/>
<text x="34" y="34" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#FFC93C" letter-spacing="2.6">ATTACK SURFACE &#183; WHAT AN ADVERSARY CAN REACH</text>

<line x1="500" y1="58" x2="500" y2="304" stroke="#FFC93C" stroke-opacity="0.12"/>

<g font-family="ui-monospace,Menlo,monospace">
  <text x="34" y="82" font-size="11.5" fill="#F85149" letter-spacing="2">TYPICAL CLOUD AI STACK</text>
  <text x="440" y="94" font-size="42" font-weight="700" fill="#F85149" text-anchor="end" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>8</text>

  <g font-size="11.5" fill="#8A6F72">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.20s" dur="0.4s" fill="freeze"/>
      <rect x="34" y="104" width="6" height="14" fill="#F85149"/><text x="52" y="116">network egress path</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.36s" dur="0.4s" fill="freeze"/>
      <rect x="34" y="130" width="6" height="14" fill="#F85149"/><text x="52" y="142">vendor API credentials</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.52s" dur="0.4s" fill="freeze"/>
      <rect x="34" y="156" width="6" height="14" fill="#F85149"/><text x="52" y="168">third-party subprocessors</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.68s" dur="0.4s" fill="freeze"/>
      <rect x="34" y="182" width="6" height="14" fill="#F85149"/><text x="52" y="194">container runtime escape</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.84s" dur="0.4s" fill="freeze"/>
      <rect x="34" y="208" width="6" height="14" fill="#F85149"/><text x="52" y="220">orchestrator RBAC misconfiguration</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.4s" fill="freeze"/>
      <rect x="34" y="234" width="6" height="14" fill="#F85149"/><text x="52" y="246">provider-side prompt retention</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.16s" dur="0.4s" fill="freeze"/>
      <rect x="34" y="260" width="6" height="14" fill="#F85149"/><text x="52" y="272">cross-border data transfer</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.32s" dur="0.4s" fill="freeze"/>
      <rect x="34" y="286" width="6" height="14" fill="#F85149"/><text x="52" y="298">shared-tenancy side channels</text></g>
  </g>

  <text x="534" y="82" font-size="11.5" fill="#3FB950" letter-spacing="2">VAULT-OS</text>
  <text x="946" y="94" font-size="42" font-weight="700" fill="#3FB950" text-anchor="end" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/>2</text>

  <g font-size="11.5" fill="#8B929E">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.4s" fill="freeze"/>
      <rect x="534" y="104" width="6" height="14" fill="#3FB950"/><text x="552" y="116">physical access to the machine</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.71s" dur="0.4s" fill="freeze"/>
      <rect x="534" y="130" width="6" height="14" fill="#3FB950"/><text x="552" y="142">a cleared insider at the console</text></g>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.6s" fill="freeze"/>
    <text x="552" y="184" font-size="10.5" fill="#5F6672">Both are physical, both are auditable, and both are</text>
    <text x="552" y="202" font-size="10.5" fill="#5F6672">already inside your existing security perimeter.</text>
    <text x="552" y="234" font-size="10.5" fill="#5F6672">The six surfaces that disappear are the six an</text>
    <text x="552" y="252" font-size="10.5" fill="#5F6672">attacker can reach without ever entering your building.</text>
  </g>
</g>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.7s" fill="freeze"/>
  <line x1="34" y1="326" x2="966" y2="326" stroke="#FFC93C" stroke-opacity="0.10"/>
  <text x="34" y="352" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#FFC93C">There is no exfiltration through a path that was never built.</text>
</g>
<rect x="0.5" y="0.5" width="999" height="379" rx="14" fill="none" stroke="#FFC93C" stroke-opacity="0.14"/>
</g>
</svg>
